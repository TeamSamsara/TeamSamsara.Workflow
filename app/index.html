<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Samsara_Icon.png" />
    <link rel="apple-touch-icon" href="/Samsara_Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Workflow - planning and task tool" />
    <title>Workflow</title>
    <!-- Shows the saved theme before the page paints, so it never flashes the wrong colours:
         the person's own choice, else the workspace default seen last time. The keys match
         StorageKeys.theme and StorageKeys.themeDefault in src/shared/constants/storageKeys.ts. -->
    <script>
      try {
        var savedTheme =
          localStorage.getItem("workflow.theme") ||
          localStorage.getItem("workflow.themeDefault");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        // Storage is blocked: the page follows the device theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
